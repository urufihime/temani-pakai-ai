<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Temani Pakai AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">

<div class="auth-card">
  <div class="auth-brand">
    <p class="eyebrow">Alat Bantu Mandiri Akademik</p>
    <h1>Temani Pakai AI</h1>
  </div>

  <!-- ===== Tampilan Login ===== -->
  <div id="loginView">
    <p class="auth-subtitle">Masuk untuk melanjutkan asesmen.</p>

    <div id="error" class="banner banner-error auth-error" role="alert"></div>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="nama@email.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>

      <button type="submit" id="loginBtn" class="btn btn-primary" style="width:100%;">Masuk</button>
    </form>

    <div class="auth-footer">
      Belum punya akun? <a href="register.html">Daftar</a>
    </div>
    <div class="auth-footer" style="margin-top:8px;">
      <a href="#" id="forgotPasswordLink">Lupa password?</a>
    </div>
  </div>

  <!-- ===== Tampilan Lupa Password (disembunyikan default) ===== -->
  <div id="resetView" style="display:none;">
    <p class="auth-subtitle">Masukkan email akunmu. Kami akan kirim link untuk mengatur ulang password.</p>

    <div id="resetMessage" class="banner auth-error" role="alert"></div>

    <form id="resetForm" novalidate>
      <label for="resetEmail">Email</label>
      <input type="email" id="resetEmail" placeholder="nama@email.com" autocomplete="email" required>

      <button type="submit" id="resetBtn" class="btn btn-primary" style="width:100%;">Kirim Link Reset</button>
    </form>

    <div class="auth-footer">
      <a href="#" id="backToLoginLink">← Kembali ke login</a>
    </div>
  </div>
</div>

<script type="module" src="js/auth.js"></script>

<footer class="app-footer">Dikembangkan oleh INK &amp; ULF</footer>
</body>
</html>
