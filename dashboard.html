<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Temani Pakai AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="masthead">
  <div class="masthead-inner">
    <div class="app-topbar-inner">
      <div>
        <p class="eyebrow" id="mastheadEyebrow">Alat Bantu Mandiri Akademik</p>
        <h1 id="mastheadTitle" style="font-size:26px;margin-bottom:6px;">Dashboard</h1>
      </div>
      <div class="app-user">
        <span class="app-user-name" id="userGreeting">Memuat…</span>
        <button class="btn btn-ghost btn-small" id="logoutBtn" style="color:var(--cream);border-color:#3a4a72;">Keluar</button>
      </div>
    </div>
  </div>
</div>

<div class="app">
  <div class="sheet" id="sheet">
    <div id="root"><p class="empty">Memuat…</p></div>
  </div>
</div>

<script type="module" src="js/dashboard.js"></script>
</body>
</html>
